<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form>
        <label for="nome"> Seu Nome </label>
        <input id="nome" type="text" placeholder="Digite aqui seu Nome"/>
        <br />
        <label for="email"> Seu E-mail</label>
        <input id="email" type="text" placeholder="Digite aqui seu E-mail"/>
        <br />
        <label for="senha"> Seua Senha</label>
        <input id="senha" type="password" placeholder="Digite aqui sua Senha"/>
        <br />
        <button>
            Cadastrar
        </button>

    </form>
</body>
</html>
